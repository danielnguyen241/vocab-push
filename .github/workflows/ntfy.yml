name: vocab-notify
on:
  schedule:
    - cron: '5 1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send random word to ntfy
        run: |
          MSG=$(python3 -c "
          import json, random
          words = json.load(open('words.json'))
          w = random.choice(words)
          ipa = w.get('ipa') or ''
          print(((w['w'] + ' ' + ipa).strip() + ' — ' + w['vi']))
          ")
          curl -s -d "$MSG" "https://ntfy.sh/daniel-vocab-fde62f1750cd4175" -H "Title: Tu vung"
