name: vocab-notify

on:
  schedule:
    # Chạy mỗi 30 phút trong khung 01:00 - 16:30 UTC (tức 08:00 - 23:30 giờ Việt Nam)
    # Có jitter delay ngẫu nhiên 0-10 phút để nhận từ cách mỗi 30 đến 45 phút tự nhiên
    - cron: '*/30 1-16 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Run vocab push
        run: python3 push_notify.py
